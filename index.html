      {role:'M.Sc. in Agricultural Sciences – Vegetable Science',org:'Faculty of Agriculture, Al-Azhar University',y:'2016'},
      {role:'B.Sc. in Agricultural Sciences',org:'Faculty of Agriculture, Al-Azhar University',y:'2007'}
    ],
    skills: [
      {t:'Quality Assurance & Academic Development',i:['Curriculum Mapping','Self-Institution Assessment','Student Evaluation']},
      {t:'Research & Scientific Skills',i:['Research Design Skills','Web of Science Seminar']},
      {t:'Digital Skills',i:['Artificial Intelligence Fundamentals','Digital Transformation','International Computer Driving Licence (ICDL)']},
      {t:'Teaching & Presentation',i:['Effective Presentation Skills']}
    ],
    conf: ['First International Conference, Faculty of Agriculture, Sohag University – November 2024 (attendee & participant)']
  }
};

const T = {
  ar: { skip:'تخطي إلى المحتوى', n_home:'الرئيسية', n_bio:'نبذة', n_papers:'الأبحاث', n_talks:'الأنشطة', n_news:'الأخبار', n_exp:'الخبرات', n_projects:'المشروعات', n_teaching:'التدريس', n_field:'التجارب الحقلية', n_contact:'التواصل',
    pos:'مدرس علوم الخضر – قسم البساتين', inst:'كلية الزراعة – جامعة الأزهر – فرع أسيوط – مصر', h_about:'نبذة عني',
    bio:'مدرس علوم الخضر بقسم البساتين، كلية الزراعة، جامعة الأزهر – فرع أسيوط، وحاصل على الدكتوراه في العلوم الزراعية (علوم الخضر) عام 2020. تتناول أبحاثه تأثير معاملات حديثة، مثل الأسمدة العضوية والحيوية والمواد النانوية والبلازما الباردة والأحماض الأمينية، على نمو وإنتاجية وجودة محاصيل الخضر.',
    cv_dl:'تحميل السيرة الذاتية', cta_mail:'تواصل للتعاون العلمي', h_int:'الاهتمامات البحثية', h_edu:'المؤهلات العلمية',
    h_papers:'المنشورات العلمية', papers_n:'منشوراً', h_talks:'المؤتمرات والأنشطة العلمية', h_news:'الأخبار', h_exp:'الخبرات', print:'طباعة / حفظ PDF', h_skills:'المهارات والتدريب',
    h_projects:'المشروعات البحثية', h_teaching:'التدريس والمقررات', h_field:'التجارب الحقلية', h_ach:'الإنجازات',
    h_contact:'لنبدأ حواراً علمياً.', p_contact:'للتعاون البحثي أو الاستفسارات الأكاديمية، يمكن التواصل عبر البريد الإلكتروني.',
    f_name:'الاسم', f_email:'البريد الإلكتروني', f_msg:'رسالتك', f_send:'إرسال', f_ok:'تم الإرسال، شكراً لك.', f_err:'تعذّر الإرسال، حاول لاحقاً أو راسلني مباشرة.',
    qr_cap:'امسح الرمز لزيارة الموقع', qr_dl:'تحميل الرمز', loading:'جارٍ التحميل…', present:'حتى الآن', doi:'عرض البحث (DOI)', lang:'EN', wa:'واتساب', doc:'سعدون مشرف السيد سلطان الهمامي | Sadoun.M.E. Sultan' },
  en: { skip:'Skip to content', n_home:'Home', n_bio:'Bio', n_papers:'Papers', n_talks:'Talks', n_news:'News', n_exp:'Experience', n_projects:'Projects', n_teaching:'Teaching', n_field:'Field Experiments', n_contact:'Contact',
    pos:'Lecturer of Vegetable Science – Department of Horticulture', inst:'Faculty of Agriculture – Al-Azhar University – Assiut Branch – Egypt', h_about:'About Me',
    bio:'Lecturer of Vegetable Science in the Department of Horticulture, Faculty of Agriculture, Al-Azhar University – Assiut Branch. He holds a Ph.D. in Agricultural Sciences (Vegetable Science, 2020). His research examines how modern treatments, such as organic and bio-fertilizers, nanomaterials, cold plasma and amino acids, affect the growth, yield and quality of vegetable crops.',
    cv_dl:'Download CV', cta_mail:'Collaborate', h_int:'Research Interests', h_edu:'Education',
    h_papers:'Research Publications', papers_n:'publications', h_talks:'Talks & Scientific Activities', h_news:'News', h_exp:'Experience', print:'Print / Save as PDF', h_skills:'Skills & Training',
    h_projects:'Research Projects', h_teaching:'Teaching & Courses', h_field:'Field Experiments', h_ach:'Academic Achievements',
    h_contact:"Let's start a scholarly conversation.", p_contact:'For research collaboration or academic enquiries, reach out by email.',
    f_name:'Name', f_email:'Email', f_msg:'Your message', f_send:'Send', f_ok:'Sent. Thank you.', f_err:'Could not send. Please try later or email directly.',
    qr_cap:'Scan to visit the website', qr_dl:'Download QR', loading:'Loading…', present:'Present', doi:'View paper (DOI)', lang:'ع', wa:'WhatsApp', doc:'Sadoun.M.E. Sultan | Lecturer of Vegetable Science' }
};

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };
const get = (o, p) => p.split('.').reduce((x, k) => x?.[k], o);
const safeUrl = u => /^https:\/\//i.test(u) ? u : '';
let lang = store.get('lang') === 'en' ? 'en' : 'ar';
let data = { works: null, jobs: null, edus: null };

/* ---------- ORCID (live) with official-CV fallback ---------- */
const FB = CONFIG.fallback, validOrcid = /^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/.test(CONFIG.orcid);
async function orcid(ep) {
  const key = `orcid:${CONFIG.orcid}:${ep}`; let c = null; try { c = JSON.parse(store.get(key) || 'null'); } catch {}
  if (c && Date.now() - c.t < CONFIG.cacheHours * 36e5) return c.d;
  try { const r = await fetch(`https://pub.orcid.org/v3.0/${CONFIG.orcid}/${ep}`, { headers: { Accept: 'application/json' } });
    if (!r.ok) throw 0; const d = await r.json(); store.set(key, JSON.stringify({ t: Date.now(), d })); return d;
  } catch (e) { if (c) return c.d; throw e; }
}
const normWorks = j => (j.group || []).map(g => { const w = g['work-summary'][0], ids = w['external-ids']?.['external-id'] || [];
  return { title: get(w,'title.title.value'), journal: get(w,'journal-title.value'), year: get(w,'publication-date.year.value') || '', doi: ids.find(i => i['external-id-type'] === 'doi')?.['external-id-value'] }; });
const normAff = (j, k) => (j['affiliation-group'] || []).flatMap(g => g.summaries || []).map(s => { const a = s[k];
  return { role: a['role-title'], dept: a['department-name'], org: get(a,'organization.name'), from: get(a,'start-date.year.value'), to: get(a,'end-date.year.value') }; }).sort((a, b) => (b.from || 0) - (a.from || 0));
const tkey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 45), byYear = (a, b) => b.year - a.year;
const mergeWorks = o => { const seen = new Set(o.map(x => tkey(x.title))); return o.concat(FB.works.filter(x => !seen.has(tkey(x.title)))).sort(byYear); };
async function load() {
  const fb = () => { data = { works: FB.works.slice().sort(byYear), jobs: FB.jobs, edus: FB.edus }; render(); };
  if (!validOrcid) return fb();
  try { const [w, e, d] = await Promise.all([orcid('works'), orcid('employments'), orcid('educations')]);
    const jobs = normAff(e, 'employment-summary'), edus = normAff(d, 'education-summary');
    data = { works: mergeWorks(normWorks(w)), jobs: jobs.length ? jobs : FB.jobs, edus: edus.length ? edus : FB.edus };
  } catch { return fb(); }
  render();
}

/* ---------- Render ---------- */
const yrs = (a, t) => a.from ? `${a.from} – ${a.to || t.present}` : (a.y || '');
function render() {
  const t = T[lang], R = document.documentElement;
  R.lang = lang; R.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.title = t.doc;
  $$('[data-i18n]').forEach(el => el.textContent = t[el.dataset.i18n]);
  $$('[data-ph]').forEach(el => el.placeholder = t[el.dataset.ph]);
  $('#lang').textContent = t.lang; $('#wa').textContent = t.wa; $('#bioText').textContent = t.bio;
  $('#interests').innerHTML = (CONFIG.lists.interests[lang] || []).map(x => `<li>${esc(x)}</li>`).join('');
  if (data.edus) $('#educations').innerHTML = data.edus.map(a => `<li>${esc(a.role || a.dept)}<small>${esc([a.org, yrs(a, t)].filter(Boolean).join(' · '))}</small></li>`).join('');
  if (data.works) {
    $('#nWorks').textContent = `${data.works.length} ${t.papers_n}`;
    $('#works').innerHTML = data.works.map(w => `<article class="card"><span class="year">${esc(w.year)}</span><h3>${esc(w.title)}</h3><div class="meta">${esc(w.journal || '')}${w.doi ? `<br><a href="https://doi.org/${encodeURI(w.doi)}" target="_blank" rel="noopener">${t.doi}</a>` : ''}</div></article>`).join('');
  }
  if (data.jobs) $('#employments').innerHTML = data.jobs.map(a => `<article class="card"><span class="year">${esc(yrs(a, t))}</span><h3>${esc(a.role || a.dept || a.org)}</h3><div class="meta">${esc([a.dept && a.role ? a.dept : '', a.org].filter(Boolean).join(' · '))}</div></article>`).join('');
  $('#conf').innerHTML = FB.conf.map(x => `<span>${esc(x)}</span>`).join('');
  $('#skills').innerHTML = FB.skills.map(g => `<div class="meta" style="margin-top:14px"><b>${esc(g.t)}</b></div><div class="chips" style="margin-top:6px">${g.i.map(x => `<span>${esc(x)}</span>`).join('')}</div>`).join('');
  ['news', 'projects', 'teaching', 'field', 'achievements'].forEach(id => {
    const arr = CONFIG.lists[id][lang] || [];
    $('#' + id).hidden = !arr.length; const n = document.querySelector(`[data-sec=${id}]`); if (n) n.hidden = !arr.length;
    $('#' + id + 'List').innerHTML = arr.map(x => `<div class="card">${esc(x)}</div>`).join('');
  });
}

/* ---------- Links, contact, optional free services ---------- */
$('#mailBtn').href = $('#mailBtn2').href = `mailto:${CONFIG.email}`; $('#mailBtn2').textContent = CONFIG.email;
$('#orcidLink').href = validOrcid ? `https://orcid.org/${CONFIG.orcid}` : 'https://orcid.org';
$('#copy').textContent = `© ${new Date().getFullYear()} Sadoun.M.E. Sultan`;
const icons = [['orcid', 'ORCID', 'iD', validOrcid ? `https://orcid.org/${CONFIG.orcid}` : ''], ['scholar', 'Google Scholar', 'GS'], ['scopus', 'Scopus', 'Sc'], ['linkedin', 'LinkedIn', 'in'], ['researchgate', 'ResearchGate', 'RG']];
$('#social').innerHTML = icons.map(([k, n, s, u]) => { const url = safeUrl(u || CONFIG.links[k]); return url ? `<a class="ic" href="${esc(url)}" target="_blank" rel="noopener me" aria-label="${n}" title="${n}">${s}</a>` : ''; }).join('')
  + `<a class="ic" href="mailto:${esc(CONFIG.email)}" aria-label="Email" title="Email">@</a>`;
if (/^\d{8,15}$/.test(CONFIG.whatsapp)) { $('#wa').href = `https://wa.me/${CONFIG.whatsapp}`; $('#wa').hidden = false; }
if (CONFIG.cvPdf) fetch(CONFIG.cvPdf, { method: 'HEAD' }).then(r => { if (r.ok) { const a = $('#cvPdf'); a.href = CONFIG.cvPdf; a.download = ''; a.hidden = false; } }).catch(() => {});
if (/^[a-z0-9-]+$/i.test(CONFIG.goatcounter)) { const s = document.createElement('script'); s.async = true; s.src = 'https://gc.zgo.at/count.js'; s.dataset.goatcounter = `https://${CONFIG.goatcounter}.goatcounter.com/count`; document.head.appendChild(s); }
if (/^[a-z0-9]+$/i.test(CONFIG.formspree)) { const f = $('#form'); f.hidden = false;
  f.addEventListener('submit', async e => { e.preventDefault(); const t = T[lang], b = f.querySelector('button'); b.disabled = true;
    try { const r = await fetch(`https://formspree.io/f/${CONFIG.formspree}`, { method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(f) }); if (!r.ok) throw 0; f.reset(); $('#fmsg').textContent = t.f_ok; }
    catch { $('#fmsg').textContent = t.f_err; } b.disabled = false; }); }

/* ---------- UI ---------- */
const root = document.documentElement;
root.dataset.theme = store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; store.set('theme', root.dataset.theme); };
$('#lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set('lang', lang); render(); };
$('#print').onclick = () => window.print();
$('#menu').onclick = () => { const o = $('#nav').classList.toggle('open'); $('#menu').setAttribute('aria-expanded', o); };
$('#nav').addEventListener('click', e => { if (e.target.tagName === 'A') $('#nav').classList.remove('open'); });
$('#top-btn').onclick = () => scrollTo({ top: 0 });
addEventListener('scroll', () => $('#top-btn').classList.toggle('show', scrollY > 600), { passive: true });
render(); load();
</script>
